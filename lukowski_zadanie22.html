<html>

<head>
  <title>
    Obliczenia pola i obwodu
  </title>
  <script language="JavaScript">
    function poleLuk(aLuk, bLuk) {
      return aLuk * bLuk;
    }

    function obwodLuk(aLuk, bLuk) {
      return 2 * (aLuk + bLuk);
    }

    function calcPoleObwod(event) {
      event.preventDefault();

      const aLuk = parseFloat(document.querySelector('[name="a_dana_luk"]').value);
      const bLuk = parseFloat(document.querySelector('[name="b_dana_luk"]').value);

      const pole = poleLuk(aLuk, bLuk);
      const obwod = obwodLuk(aLuk, bLuk);

      const poleOutput = document.querySelector('#wyprowadz_pole');
      const obwodOutput = document.querySelector('#wyprowadz_obwod');

      poleOutput.textContent = pole;
      obwodOutput.textContent = obwod;
    }
  </script>
</head>

<body>
  <h1>Obliczenia obwodu i pola prostokąta</h1>
  <br> <br>
  <form name="formularz" action="#" onsubmit="calcPoleObwod(event); return false;">
    <label>
      Podaj a=
      <input type="number" step="0.001" name="a_dana_luk">
    </label>

    <label>
      Podaj b=
      <input type="number" step="0.001" name="b_dana_luk">
    </label>

    <input TYPE="submit" Value="oblicz">
  </form>

  <table>
    <tr>
      <th>Pole = </th>
      <td id="wyprowadz_pole"></td>
    </tr>
    <tr>
      <th>Obwod = </th>
      <td id="wyprowadz_obwod"></td>
    </tr>
  </table>
</body>

</html>
