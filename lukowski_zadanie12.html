<body>
  <div style="color:green;font-size:50px;'>
    <script language="JavaScript">
    var m_bil=prompt("m=","");
    var b_bil
    var c_bil
    var a_bil=parseFloat(m_bil);
    b_bil+a_bil+1;
    c_bil+a_bil*(a_bil+1);
    document.write("1/"+a_bil+" = 1/"+b_bil+" + 1/"+c_bil+"<br>");
  </script>
  </div>
