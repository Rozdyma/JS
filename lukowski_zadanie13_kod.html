<!DOCTYPE html>
<html>
<body>
    <div style="color:darkblue; font-size:200%;">
        <script language="JavaScript">
          
            var m_kow = prompt("Podaj m =", "");
            var m = parseFloat(m_kow);

            var a = m + 1;
            var b = m * (m + 1);

            document.write("Dla m = " + m + "<br>");
            document.write("1/" + m + " = 1/" + a + " + 1/" + b);
        </script>
    </div>
