<html>

<head>
  <title>
    Obliczenia pola i obwodu
  </title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f0f0f0;
      margin: 0;
      padding: 0;
    }
  
    h1 {
      text-align: center;
      margin-top: 20px;
    }
  
    form {
      text-align: center;
      margin: 20px;
    }
  
    label {
      display: block;
      margin-bottom: 10px;
    }
  
    input[type="number"] {
      width: 100px;
      padding: 5px;
      font-size: 16px;
    }
  
    input[type="submit"] {
      background-color: #007bff;
      color: #fff;
      border: none;
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
    }
  
    input[type="submit"]:hover {
      background-color: #0056b3;
    }
  
    table {
      margin: 20px auto;
      border-collapse: collapse;
      width: 50%;
    }
  
    th, td {
      border: 1px solid #ddd;
      padding: 8px;
      text-align: center;
    }
  
    th {
      background-color: #007bff;
      color: #fff;
    }
  </style>
  <script language="JavaScript">
    function poleLuk(aLuk, bLuk, hLuk) {
      return ((aLuk + bLuk) * hLuk) / 2;
    }

    function obwodLuk(aLuk, bLuk, hLuk) {
      const biggestSide = Math.max(aLuk, bLuk);
      const smallestSide = Math.min(aLuk, bLuk);

      const cTriangle = (biggestSide - smallestSide) / 2;

      const cLuk = Math.sqrt(hLuk**2 + cTriangle**2);

      return 2 * cLuk + aLuk + bLuk;
    }

    function calcPoleObwod(event) {
      event.preventDefault();

      const aLuk = parseFloat(document.querySelector('[name="a_dana_luk"]').value);
      const bLuk = parseFloat(document.querySelector('[name="b_dana_luk"]').value);
      const hLuk = parseFloat(document.querySelector('[name="h_dana_luk"]').value);

      const pole = poleLuk(aLuk, bLuk, hLuk);
      const obwod = obwodLuk(aLuk, bLuk, hLuk);

      const poleOutput = document.querySelector('#wyprowadz_pole');
      const obwodOutput = document.querySelector('#wyprowadz_obwod');

      poleOutput.textContent = pole.toFixed(2);
      obwodOutput.textContent = obwod.toFixed(2);
    }
  </script>
</head>

<body>
  <h1>Obliczenia obwodu i pola trapezu</h1>
  <br> <br>
  <form name="formularz" action="#" onsubmit="calcPoleObwod(event); return false;">
    <label>
      Podaj a=
      <input type="number" step="0.001" name="a_dana_luk">
    </label>

    <label>
      Podaj b=
      <input type="number" step="0.001" name="b_dana_luk">
    </label>

    <label>
      Podaj h=
      <input type="number" step="0.001" name="h_dana_luk">
    </label>

    <input TYPE="submit" value="oblicz">
  </form>

  <table>
    <tr>
      <th>Pole = </th>
      <td id="wyprowadz_pole"></td>
    </tr>
    <tr>
      <th>Obwod = </th>
      <td id="wyprowadz_obwod"></td>
    </tr>
  </table>
</body>

</html>
