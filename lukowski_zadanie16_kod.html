<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kacper Lukowski</title>
</head>
<html>
<body>
    <div style="color:darkblue; font-size:200%;">
        <script language="JavaScript">
            var D1_luk = prompt("A=", "");
            var D2_luk = prompt("B=", "");
            var a = parseFloat(D1_luk);
            var b = parseFloat(D2_luk);
            var c;
            var d;
            var e;
            var f;
            var o;

            c = a * a * a;
            d = 3 * a * a * b;
            e = 3 * a * b * b;
            f = b * b * b;
            o = c + d + e + f;

            document.write("(" + a + " + " + b + ")^3 = " + a + "^3 + 3" + a + "^2" + b + " + 3" + a + "" + b + "^2 + " + b + "^3 = " + o);
        </script>
    </div>
</body>
