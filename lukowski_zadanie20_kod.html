  <script>
    function AB_luk() {
      let aX_luk = parseFloat(document.getElementById('aX').value);
      let aY_luk = parseFloat(document.getElementById('aY').value);

      let bX_luk = parseFloat(document.getElementById('bX').value);
      let bY_luk = parseFloat(document.getElementById('bY').value);

      document.getElementById("answer").innerHTML = "|AB|= "
        + (Math.sqrt((aX_luk - bX_luk) ** 2 + (aY_luk - bY_luk) ** 2)).toFixed(2);
    }
    function BC_luk() {
      let bX_mys = parseFloat(document.getElementById('bX').value);
      let bY_luk = parseFloat(document.getElementById('bY').value);
      let cX_luk = parseFloat(document.getElementById('cX').value);
      let cY_luk = parseFloat(document.getElementById('cY').value);

      document.getElementById("answer").innerHTML = "|BC|= "
        + (Math.sqrt((cX_luk - bX_luk) ** 2 + (cY_luk - bY_luk) ** 2)).toFixed(2);
    }

    function AC_luk() {
      let aX_luk = parseFloat(document.getElementById('aX').value);
      let aY_luk = parseFloat(document.getElementById('aY').value);
      let cX_luk = parseFloat(document.getElementById('cX').value);
      let cY_luk = parseFloat(document.getElementById('cY').value);

      document.getElementById("answer").innerHTML = "|AC|= "
        + (Math.sqrt((aX_luk - cX_luk) ** 2 + (aY_luk - cY_luk) ** 2)).toFixed(2);
    }

  </script>
